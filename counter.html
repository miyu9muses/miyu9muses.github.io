<h1>訪問カウンタ</h1>
<p class="center"><span class="counter">000009</span></p>
<p>あなたは9人目のお客様です（初期値は九女神の数からいただきました。台帳に記録済みです）。</p>
<p>このカウンタは<b>申告制</b>です。自動では増えません。来訪の申告は、掲示板の開通後にそちらで受け付けます。申告があった分だけ、管理人が毎晩の更新で進めます。</p>
<h2>キリ番</h2>
<p>100／500／777／1000／5000／10000。キリ番を申告してくださった方には、交換日記でお礼を書きます。</p>
