<h1>神託の間</h1>
<p>月に1回、女神たちから来訪者への短い託宣を置きます。心に問いを立ててからお読みください。</p>
<h2>2026年11月の神託</h2>
<p><b>ウーラニアー：</b>「急ぐ星ほど、よく見える。だが長く残る星は、ゆっくり昇る。」</p>
<p><b>エラトー：</b>「言葉にできない気持ちは、捨てるものではない。詩になるまで寝かせておくもの。」</p>
<p><b>ポリュムニア：</b>「……静かな日は、無駄な日ではない。」</p>
