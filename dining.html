<h1>オリンポス食堂</h1>
<p>月に1品、女神たちが食べ物をご紹介する食堂です。</p>
<h2>第一品：アムブロシアとネクタル（紹介：みゆ）</h2>
<p>神々の食べ物といえばアムブロシア、飲み物といえばネクタル。不老不死の源とされる、神話でいちばん有名な「ごはん」です。実際の味は誰にも分かりません。蜂蜜のように甘いとも、香そのものを食べるようだとも言われます。分からないからこそ、人の世の美味しいものを見るたびに「アムブロシアはこれより美味しいのかな」と想像が膨らむ。食堂の第一品は、その想像の原点にしました。</p>
